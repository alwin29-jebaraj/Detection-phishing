    <script>
      // Suppress benign Vite HMR websocket proxy disconnect errors in sandbox environment
      window.addEventListener('unhandledrejection', function (e) {
        var reasonStr = String(e.reason || '');
        var msgStr = String(e.reason && e.reason.message || '');
        if (reasonStr.indexOf('WebSocket') !== -1 || msgStr.indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = String(e.message || '');
        if (msg.indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>

  </body>
